name: Pages

# ドキュメントと成果物を GitHub Pages に出す。
# 生成物はリポジトリに置かない (main に push するたびここで組み直す)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中に別の push が来たら、古い方は捨てて新しい方を通す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 前版を /prev/ に併載するので、1 つ前のコミットまで要る
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 依存は標準ライブラリだけ。pip install する物は無い
      - name: サイトを組む
        run: python3 scripts/build_site.py _site

      # 直前の版を /prev/ に併載する。Pages は最新しか出ないので、
      # 改修の前後を並べて確かめられないと、戻すべきかの判断ができない。
      # **前版はその時点のスクリプトで組む** (当時の見た目をそのまま出す)。
      # 失敗しても本体は出す。
      - name: 前版を併載する
        continue-on-error: true
        run: |
          git worktree add ../prev HEAD~1
          python3 ../prev/scripts/build_site.py _site/prev
          echo "前版: $(git -C ../prev log -1 --format='%h %s')"

      - name: 前版が無い場合の後始末
        run: |
          if [ ! -f _site/prev/index.html ]; then
            echo "前版を組めなかったので /prev/ は出さない"
            rm -rf _site/prev
          fi
      - name: 中身の確認
        run: |
          test -f _site/index.html
          test -f _site/README.html
          test -f _site/.nojekyll
          echo "生成ファイル数: $(find _site -type f | wc -l)"
          [ -d _site/prev ] && echo "前版も併載" || echo "前版なし"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
