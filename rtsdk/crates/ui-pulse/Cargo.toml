[package]
name = "ui-pulse"
description = "デジタルツイン・パルスグラフ (設計と実測の重ね合わせ / タイムトラベル)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pulse-trace = { workspace = true, features = ["std"] }
egui = { version = "0.29", optional = true }
eframe = { version = "0.29", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
] }
# wasm-bindgen が生成するグルーが直に参照する。web のときだけ。
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
# 既定は描画に依らない側だけ。CI はこれだけ回せば足りる。
default = []
# Canvas 描画 (egui)。Wasm でもネイティブでも同じコードが動く。
gui = ["dep:egui"]
# ブラウザで動かすところまで (eframe)。
web = ["gui", "dep:eframe", "dep:wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]
