<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rtsdk pulse analyzer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16181d; color: #ddd;
                   font-family: system-ui, sans-serif; }
      #canvas { width: 100%; height: 100%; display: block; }
      #note { position: fixed; bottom: 8px; left: 12px; font-size: 12px; opacity: .55; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="note">
      横軸 µs / 縦軸レーン。細い枠が設計 (型安全 SDK の意図)、塗りが実測。
      波形をクリックするとその時刻へ巻き戻る。
    </div>

    <!--
      組み方:
        cargo build -p ui-pulse --features web --target wasm32-unknown-unknown --release
        wasm-bindgen --target web --out-dir crates/ui-pulse/web \
            target/wasm32-unknown-unknown/release/ui_pulse.wasm
      その後この index.html を静的サーバから開く (file:// では wasm を読めない)。
    -->
    <script type="module">
      import init, { start } from "./ui_pulse.js";
      await init();
      await start("canvas");
    </script>
  </body>
</html>
